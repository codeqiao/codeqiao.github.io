<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晴湾物语</title><link rel="stylesheet" href="style.css"></head><body><div id="world"></div><header><a class="game-back" href="/games/" aria-label="返回游戏列表">← <span>游戏列表</span></a><a class="game-discuss" href="/games/sunny-bay/#comments" target="_blank" rel="noopener">留言建议 ↗</a><div class="brand"><span class="logo">☀</span><div><b>晴湾物语</b><small>SUNNY BAY</small></div></div><div class="stats"><div><small>资金</small><strong id="money"></strong></div><div><small>居民</small><strong id="population"></strong></div><div><small>幸福度</small><strong id="happiness"></strong></div><div><small>每月收支</small><strong id="income"></strong></div></div><div class="clock"><span id="date"></span><span id="daytime" aria-label="昼夜"></span><button id="pause" title="暂停 / 继续">Ⅱ</button><button id="speed" title="游戏速度">1×</button></div></header><aside><div class="eyebrow">YOUR LITTLE ISLAND</div><h1>在海风里，<br>建一座理想小镇。</h1><p id="hint">选择下方工具，在岛上点击空地开始建设。</p><div class="goal"><span>当前目标</span><b id="goal">让第一批居民安家</b><div class="bar"><i id="progress"></i></div><small id="goaltext">先从海中填出陆地</small></div><div class="budget"><div class="budget-title"><b>小镇财政</b><span>每月预估</span></div><div class="budget-line"><span>居民税收</span><strong id="taxRevenue"></strong></div><div class="budget-line"><span>商业与农业</span><strong id="businessRevenue"></strong></div><div class="budget-line"><span>维护费用</span><strong id="maintenance"></strong></div><div class="budget-note" id="prosperity"></div><div class="budget-note" id="season" aria-label="季节预告"></div><div class="loan"><span id="loanStatus"></span><button id="loan">申请贷款</button></div><div class="tax-label">税收政策 <span>影响幸福度</span></div><div class="tax-options" role="group" aria-label="税收政策"><button data-tax="low">低税</button><button data-tax="normal">普通</button><button data-tax="high">高税</button></div><div class="tax-label">人手优先 <span>影响产出与服务</span></div><div class="labor-options" role="group" aria-label="人手优先"><button data-labor="farm">粮食</button><button data-labor="service">民生</button><button data-labor="shop">商业</button></div><div class="budget-note" id="laborNote"></div><div class="budget-note" id="restStatus"></div></div><div class="help">选择“查看”点击建筑或居民代表<br>拖动旋转 · 滚轮缩放 · 右键平移<br>点击画面后用方向键选格、回车建设</div></aside><div class="camera-controls" aria-label="视角控制"><button id="zoomIn" aria-label="放大视角">＋</button><button id="zoomOut" aria-label="缩小视角">−</button><button id="panMode" aria-pressed="false" title="切换拖动方式">拖动旋转</button></div><div id="notice"></div><div id="roadPreview" hidden></div><div class="toolbar"><div class="tool-title"><b>建设小镇</b><small>填海建岛 · 港口通航</small></div><button id="brush" class="utility" aria-label="切换填海范围" title="切换单格或九格填海">1×1 填海</button><div id="tools"></div><button id="save" class="utility">保存</button><button id="exportSave" class="utility">导出存档</button><button id="importSave" class="utility">导入存档</button><input id="saveFile" type="file" accept="application/json,.json" hidden><button id="reset" class="utility">新岛屿</button></div><div class="foot">晴湾群岛 · 第一期试玩版 <span>自动保存已开启</span></div><script type="module" src="game.js"></script></body></html>
